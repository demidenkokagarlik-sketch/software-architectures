version: '3.8'
services:
  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - catalog
      - users
      - orders

  catalog:
    image: python:3.11-slim
    command: python -c "import http.server, socketserver; handler = http.server.SimpleHTTPRequestHandler; http.server.HTTPServer(('0.0.0.0', 5000), handler).serve_forever()"

  users:
    image: python:3.11-slim
    command: python -c "import http.server, socketserver; handler = http.server.SimpleHTTPRequestHandler; http.server.HTTPServer(('0.0.0.0', 5000), handler).serve_forever()"

  orders:
    image: python:3.11-slim
    command: python -c "import http.server, socketserver; handler = http.server.SimpleHTTPRequestHandler; http.server.HTTPServer(('0.0.0.0', 5000), handler).serve_forever()"